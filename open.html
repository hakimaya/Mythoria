<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mythoria</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="script.js" defer></script>
        <style type="text/tailwindcss">
            @theme {
                --font-title:"Cinzel",serif;
                --font-body:"Inter", sans-serif;
            }
        </style>
    </head>
    <body>
         <header class="relative flex items-center justify-between px-[20px] py-[16px] bg-[#0b0712] ">


                    <a href="index.html">
                        <img 
                        src="Mythoria, emblème du compas mystique.png" 
                        alt="mythorialogo" 
                        class="w-[100px] md:w-[120px] lg:w-[140px] h-auto block">
                    </a>


                    <nav
                    id="menu"
                    class="font-body hidden absolute top-full left-0 w-full
                    flex-col gap-5 bg-[#0b0712] p-5 text-white z-50
                    lg:static lg:flex lg:w-auto lg:flex-row
                    lg:items-center lg:gap-[32px] lg:p-0">
                        
                        <a class="hover:text-[#e9c16d] transition-colors"href="index.html">Accueil</a>
                        <a class="hover:text-[#e9c16d] transition-colors"href="shop.html">Boutique</a>
                        <a class="hover:text-[#e9c16d] transition-colors"href="#">Ma collection</a>
                        <a class="hover:text-[#e9c16d] transition-colors"href="#">Le jeu</a>
                        <a class="hover:text-[#e9c16d] transition-colors"href="#">A propos</a>

                    </nav>

                    <div class="flex items-center gap-4 text-white">

                            <a href="#" aria-label="Mon panier">
                                <i data-lucide="shopping-cart" class="w-[20px] h-[20px] hover:text-[#e9c16d] transition-colors"></i>
                            </a>

                            <button
                            id="menu-toggle"
                            type="button"
                            aria-label="Ouvrir le menu"
                            aria-controls="menu"
                            aria-expanded="false"
                            class="lg:hidden text-[#e9c16d] text-[28px] cursor-pointer"
                            >
                            ☰
                            </button>

                    </div>


            </header>

            <main>
                <section class="text-center bg-[#0b0712]  py-5 px-16">
                    <h1 class="font-title text-[#e9c16d] text-3xl md:text-4xl mb-4">LA CHAMBRE D'OUVERTURE </h1>
                    <p class="font-body text-gray-300">Vos procheines legendes vous attendent</p>
                </section>    
            </main>
    </body>
