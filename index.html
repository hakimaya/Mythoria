<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mythoria</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="script.js" defer></script>
        <style type="text/tailwindcss">
            @theme {
                --font-title:"Cinzel",serif;
                --font-body:"Inter", sans-serif;
            }
        </style>
    </head>
    <body>
        <main>

            <header class="relative flex items-center justify-between px-[20px] py-[16px] bg-[#0b0712] ">


                    <a href="index.html">
                        <img 
                        src="Mythoria, emblème du compas mystique.png" 
                        alt="mythorialogo" 
                        class="w-[100px] md:w-[120px] lg:w-[140px] h-auto block">
                    </a>


                    <nav
                    id="menu"
                    class="font-body hidden absolute top-full left-0 w-full
                    flex-col gap-5 bg-[#0b0712] p-5 text-white z-50
                    lg:static lg:flex lg:w-auto lg:flex-row
                    lg:items-center lg:gap-[32px] lg:p-0">
                        
                        <a class="hover:text-[#e9c16d] transition-colors"href="#">Accueil</a>
                        <a class="hover:text-[#e9c16d] transition-colors"href="#">Boutique</a>
                        <a class="hover:text-[#e9c16d] transition-colors"href="#">Ma collection</a>
                        <a class="hover:text-[#e9c16d] transition-colors"href="#">Le jeu</a>
                        <a class="hover:text-[#e9c16d] transition-colors"href="#">A propos</a>

                    </nav>

                    <div class="flex items-center gap-4 text-white">

                            <a href="#" aria-label="Mon panier">
                                <i data-lucide="shopping-cart" class="w-[20px] h-[20px] hover:text-[#e9c16d] transition-colors"></i>
                            </a>

                            <button
                            id="menu-toggle"
                            type="button"
                            aria-label="Ouvrir le menu"
                            aria-controls="menu"
                            aria-expanded="false"
                            class="lg:hidden text-[#e9c16d] text-[28px] cursor-pointer"
                            >
                            ☰
                            </button>

                    </div>


            </header>
            
            <section class="relative min-h-[85vh]
            bg-[url('bg1.jpg')]
            bg-cover bg-center bg-no-repeat
            flex items-center
            px-[20px] md:px-[40px] lg:px-[64px]
            py-[60px]">

            
                    <div class="absolute inset-0 bg-black/40"></div>

                    
                    <div class="relative z-10
                        flex flex-col items-start
                        gap-5 max-w-[600px]">

                        
                        <img
                            src="Mythoria, emblème du compas mystique.png"
                            alt="Mythoria Logo"
                            class="w-[240px] md:w-[300px] lg:w-[360px]
                            h-auto max-w-full">

                        
                        <h2 class="font-title
                            text-[20px] md:text-[25px] lg:text-[30px]
                            font-semibold
                            bg-gradient-to-b from-[#fff3cf]
                            via-[#ddb96d] to-[#8f6324]
                            bg-clip-text text-transparent">

                            DES CARTES, DES LÉGENDES,
                            VOTRE HISTOIRE

                        </h2>

                        
                        <p class="font-body text-white
                            text-[14px] md:text-[16px]
                            leading-7 max-w-[480px]">

                            Plongez dans un univers fantastique où chaque
                            carte raconte une légende. Collectionnez,
                            échangez et affrontez des créatures mythiques.

                        </p>

                        
                        <div class="flex flex-col sm:flex-row gap-4">

                            <a href="shop.html"
                                class="bg-[#e9c16d] text-[#0b0712]
                                px-6 py-3 rounded
                                font-body font-semibold
                                hover:bg-[#f5d995]
                                transition-colors text-center">

                                Découvrir les boosters →

                            </a>

                            <a href="grimoire.html"
                                class="border border-[#e9c16d]
                                text-white px-6 py-3 rounded
                                font-body font-semibold
                                hover:bg-[#e9c16d]
                                hover:text-[#0b0712]
                                transition-colors text-center">

                                Ouvrir mon grimoire →

                            </a>

                        </div>

                    </div>

            </section>

        </main>
    </body>
    
</html>
